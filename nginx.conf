server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — serve index.html for all non-file routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the backend container
  location ~ ^/(products|categories|orders|orderDetails|clients|cashiers|vendors|
    unitOfMeasures|productPresentations|purchase-items|inventory-lots|
    storeProfiles|catalogTemplates|productAttributeDefinitions|
    productAttributeValues|productVariants|ang-questions|ang-exams|
    ang-results)/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
