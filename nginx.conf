server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — serve index.html for all non-file routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── API reverse proxy ────────────────────────────────────────────────
  # Keep this list in sync with src/app/core/api/api-paths.ts (API_COLLECTIONS)
  # and proxy.conf.json. Note the `($|/)` terminator: collection requests such
  # as GET /products carry NO trailing slash and must still be proxied, or they
  # fall through to the SPA fallback above and return HTML where JSON is
  # expected.
  location ~ ^/(products|productPresentations|categories|clients|cashiers|vendors|unitOfMeasures|orders|orderDetails|purchase-items|inventory-lots|storeProfiles|catalogTemplates|productAttributeDefinitions|productAttributeValues|productVariants|ang-questions|ang-exams|ang-results|uploads|api)($|/) {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # ── Runtime configuration ────────────────────────────────────────────
  # Must never be cached, otherwise a redeploy that rewrites
  # runtime-config.js keeps serving the previous API host.
  location = /assets/config/runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
