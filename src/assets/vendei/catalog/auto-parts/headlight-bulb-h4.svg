<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffde7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f57f17;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f57f17;stop-opacity:0.05" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="24" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="16" fill="url(#accent)"/>

  <circle cx="256" cy="190" r="100" fill="white" opacity="0.6" filter="url(#shadow)"/>
  <text x="256" y="210" text-anchor="middle" font-size="96" dominant-baseline="central">🔋</text>

  <rect x="60" y="330" width="392" height="1" fill="#f57f17" opacity="0.2"/>

  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#1e293b">
    Headlight Bulb
  </text>
  <text x="256" y="414" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#475569">
    H4
  </text>

  <rect x="120" y="450" width="272" height="28" rx="14" fill="#f57f17" opacity="0.12"/>
  <text x="256" y="469" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#f57f17" opacity="0.7">Electrical</text>
</svg>