<h1 mat-dialog-title>Update Quantity</h1>
<div mat-dialog-content>
  <mat-form-field>
    <mat-label>Quantity{{ data.unitLabel ? ' (' + data.unitLabel + ')' : '' }}</mat-label>
    <input matInput type="number" [(ngModel)]="data.quantity" [step]="data.unitLabel ? 0.01 : 1" min="0.01">
  </mat-form-field>
  
  <mat-form-field>
    <input matInput type="number" placeholder="Enter Price" [(ngModel)]="data.price" step="0.01" min="0">
  </mat-form-field>

</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button [mat-dialog-close]="data" cdkFocusInitial>Save</button>
</div>
